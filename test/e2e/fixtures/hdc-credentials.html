<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>华为开发者联盟</title>
<style>body{font:14px sans-serif;padding:24px}[role=tab]{display:inline-block;padding:12px;cursor:pointer}section{margin:20px 0;padding:16px;border:1px solid #ddd}button{padding:8px 16px}</style></head>
<body><div role="tablist"><div role="tab" id="developer-tab">开发者级凭证</div><div role="tab" id="project-tab">项目级凭证</div><div role="tab">应用级凭证</div></div>
<section><h2>服务账号凭证</h2><button id="service-create">创建</button><p>基于Service Account开放鉴权</p></section>
<section><h2>API Key凭证</h2><button id="api-key-create">创建</button></section>
<section><h2>API客户端凭证</h2><button id="api-client-create">创建</button></section>
<script>
const developer = location.pathname.endsWith('/0');
document.getElementById('developer-tab').setAttribute('aria-selected', String(developer));
document.getElementById('project-tab').setAttribute('aria-selected', String(!developer));
document.getElementById('developer-tab').onclick = () => parent.__navigate('/consumer/cn/consoleIframe/api/credentials/0');
document.getElementById('service-create').onclick = () => {
  if (!developer) { parent.__huawei.wrongCreate++; return; }
  parent.__navigate('/consumer/cn/consoleIframe/api/addServiceAccountKeys/0/developer/0');
};
for (const id of ['api-key-create','api-client-create']) document.getElementById(id).onclick = () => parent.__huawei.wrongCreate++;
</script></body></html>
