<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>华为开发者联盟</title>
<style>body{font:14px sans-serif;padding:24px}app-service-account-add{display:block}label{display:inline-block;margin:12px}input,textarea{display:block;width:80%;margin:16px 0;padding:8px}input[type=radio]{display:inline;width:auto}button{padding:8px 16px}.ant-checkbox{display:inline-block;width:14px;height:14px;border:1px solid #aaa;margin-right:6px}.ant-checkbox-checked{background:#1687ff}textarea{height:120px}</style></head>
<body><app-service-account-add><h2>创建服务账号凭证</h2><button id="confirm">确认</button>
<input placeholder="请输入名称"><label><input type="radio" checked disabled>开发者级凭证</label>
<div id="roles"><label class="checkbox"><span class="ant-checkbox ucd-check"></span><span title="APP管理员">APP管理员</span></label><label class="checkbox"><span class="ant-checkbox ucd-check"></span><span>管理员</span></label></div>
<input placeholder="请输入描述"><textarea placeholder="请输入公钥或点击下方按钮生成公私钥"></textarea><button id="generate">生成公私钥</button></app-service-account-add>
<script>
const params = new URLSearchParams(location.search);
const mode = params.get('case') || 'normal';
const pub = document.querySelector('textarea');
const roles = [...document.querySelectorAll('label.checkbox')];
for (const role of roles) role.onclick = () => role.querySelector('.ant-checkbox').classList.toggle('ant-checkbox-checked');
if (mode === 'unknown-public') pub.value = 'UNKNOWN_PUBLIC_KEY';
if (mode === 'extra-role') roles[1].querySelector('span').classList.add('ant-checkbox-checked');
if (mode === 'unknown-role') roles[0].querySelector('span').className = 'unknown-marker';
let privateKey = '';
document.getElementById('generate').onclick = () => {
  parent.__huawei.generate++;
  parent.__huawei.hookReady = !!window.__apkgoDownloadHook;
  if (mode === 'generation-failed') return;
  setTimeout(() => { pub.value = 'FAKE_PUBLIC_KEY'; privateKey = '-----BEGIN PRIVATE KEY-----\nFAKE\n-----END PRIVATE KEY-----'; pub.dispatchEvent(new Event('input',{bubbles:true})); },100);
};
window.__download = () => {
  const json = JSON.stringify({ key_id: 'k1', sub_account: '317654321', ...(mode === 'missing-private' ? {} : { private_key: privateKey }) });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download = 'huawei-service-account.json'; document.body.appendChild(a); a.click(); a.remove();
  return json;
};
document.getElementById('confirm').onclick = () => {
  parent.__huawei.confirm++;
  if (!pub.value || !privateKey || !document.querySelector('input').value || !roles[0].querySelector('span').classList.contains('ant-checkbox-checked')) throw new Error('Incomplete test form');
  window.__download();
  parent.__navigate('/consumer/cn/consoleIframe/api/credentials/0');
};
</script></body></html>
